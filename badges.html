<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="page_title_badges">Badges · HIIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
  </head>
  <body class="profile-page badges-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand brand--link" href="index.html">
          <div class="brand-mark" aria-hidden="true">HI</div>
          <div class="brand-text">
            <strong>HIIT ME UP</strong>
            <span data-i18n="brand_badges">Badges</span>
          </div>
        </a>
        <div class="app-header-actions">
          <button type="button" class="theme-toggle" aria-label="Toggle color theme"></button>
          <a
            href="badges.html"
            class="header-badges-link header-badges-link--current"
            aria-label="Badges"
            aria-current="page"
            data-i18n-aria-label="header_badges_current"
          >
            <svg
              class="header-badges-link__icon"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
              <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
              <path d="M4 22h16" />
              <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
              <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
              <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
            </svg>
          </a>
          <div data-user-menu></div>
        </div>
      </div>
    </header>

    <main class="badges-main shell">
      <h1 class="badges-page-title" data-i18n="badges_page_title">Your badges</h1>
      <p class="badges-page-lead" data-i18n="badges_page_lead">
        Finish sessions with every exercise checked to log a completion. Locked badges stay phantom until you hit the
        milestone on this device.
      </p>
      <p id="badges-summary" class="badges-summary" role="status" aria-live="polite"></p>
      <ul class="badges-grid" id="badges-grid" role="list"></ul>
    </main>

    <div data-site-footer></div>

    <script src="user.js"></script>
    <script src="progress.js"></script>
    <script src="user-menu.js"></script>
    <script src="data.js"></script>
    <script src="saved.js"></script>
    <script src="badges.js"></script>
    <script src="footer.js"></script>
  </body>
</html>
